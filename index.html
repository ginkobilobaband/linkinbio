<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ginko Biloba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Chonky Pixels';
    src: url('fonts/ChonkyPixels.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --pink: #FE64A3;
    --teal: #07BEB8;
    --violet: #8B5FBF;
    --paper: #FFFFFF;
    --ink: #0B0F0D;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  html { overflow-x: hidden; }

  body {
    font-family: 'Space Mono', monospace;
    color: var(--paper);
    overflow-x: hidden;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px) clamp(16px, 6vw, 24px);
    position: relative;
  }

  /* ---------- animated gradient background ---------- */

  .bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    overflow: hidden;
    pointer-events: none;
    background: linear-gradient(270deg, var(--pink), var(--teal), var(--violet));
    background-size: 600% 600%;
    -webkit-animation: bgFlow 30s ease infinite;
    -moz-animation: bgFlow 30s ease infinite;
    animation: bgFlow 30s ease infinite;
  }

  @-webkit-keyframes bgFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @-moz-keyframes bgFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes bgFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg { animation: none !important; background-position: 50% 50%; }
  }

  /* ---------- grain: texture analogica ---------- */

  .grain {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0.16;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 160px 160px;
  }

  /* ---------- leaves: layer proprio, sopra al contenuto (avatar incluso) ---------- */

  .leaf-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    overflow: hidden;
    pointer-events: none;
    mix-blend-mode: soft-light;
  }

  .leaf {
    position: absolute;
    max-width: none;
    mix-blend-mode: soft-light;
    transition: transform 0.2s ease-out;
    will-change: transform;
  }

  .leaf--tl {
    width: clamp(374px, 46vw, 770px);
    top: -9vh;
    left: -8vw;
    transform: rotate(5deg);
  }

  .leaf--mid {
    width: clamp(308px, 37vw, 616px);
    top: 16vh;
    left: 23vw;
  }

  .leaf--br {
    width: clamp(209px, 22vw, 396px);
    bottom: -7vh;
    right: 4vw;
    transform: rotate(18deg);
  }

  .leaf--br2 {
    width: clamp(121px, 13vw, 220px);
    bottom: 2vh;
    right: -5vw;
    transform: rotate(38deg);
  }

  @media (max-width: 720px) {
    .leaf--mid  { display: none; }
    .leaf--tl   { width: 770px; top: -15vh; left: -80vw; }
    .leaf--br   { width: clamp(150px, 38vw, 240px); bottom: 5vh; left: -12vw; right: auto; transform: rotate(-10deg); }
    .leaf--br2  { display: none; }
  }

  /* ---------- content column (ex "card", ora senza chrome) ---------- */

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    min-height: min(720px, 82dvh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: clamp(28px, 7vw, 44px) clamp(18px, 6vw, 32px) clamp(20px, 5vw, 32px);
    gap: 24px;
  }

  .top {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-family: 'ChonkyPixels', 'Space Mono', monospace;
    color: var(--paper);
    margin: 0 auto;
    text-align: center;
  }
.ginko{
  color: #FFF;
text-align: center;
-webkit-text-stroke-width: 2px;
-webkit-text-stroke-color: #FFF;
font-family: ChonkyPixels;
font-size: 72px;
font-style: normal;
font-weight: 500;
line-height: normal;
letter-spacing: 23.04px;
}
.biloba{
  color: #FFF;
font-family: ChonkyPixels;
font-size: 72px;
font-style: normal;
font-weight: 500;
line-height: normal;
letter-spacing: 10.8px;
margin-bottom:20px
}
  .avatar {
    width: 150px;
    height: 150px;
    margin: 0 auto 30px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.9);
    background: linear-gradient(160deg, var(--violet), var(--teal));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 3vw, 14px);
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: clamp(12px, 4vw, 16px) clamp(16px, 5vw, 22px);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.40));
    border: 1px solid rgba(255, 255, 255, 0.9);
    color: var(--paper);
    text-decoration: none;
    font-size: clamp(12.5px, 3.6vw, 14px);
    letter-spacing: 0.06em;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.50));
    transform: translateY(-1px);
    outline: none;
  }

  .links a .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
  }

  .links a .icon-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  footer {
    font-size: clamp(11px, 3vw, 12.5px);
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.85);
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <div class="bg"></div>

  <div class="grain"></div>

  <main class="page">
    <div class="top">
      <h1 class="ginko">GINKO</h1>
      <h1 class="biloba">BILOBA</h1>

      <div class="avatar">
        <img src="https://www.ginko-biloba.it/assets/band.jpg" alt="Ginko Biloba">
      </div>

      <ul class="links">
        <li>
          <!-- ICONA SPOTIFY: sostituisci il contenuto di .icon con il tuo svg/img -->
          <a class="spotify" href="#" target="_blank" rel="noopener">
            <span>spotify</span>
            <span class="icon"><img src="https://www.ginko-biloba.it/assets/icon-spotify.svg" alt="" class="icon-img"></span>
          </a>
        </li>
        <li>
          <!-- ICONA CONTATTI: sostituisci il contenuto di .icon con il tuo svg/img -->
          <a class="contact" href="mailto:booking@ginkobiloba.it">
            <span>contatti</span>
            <span class="icon"><img src="https://www.ginko-biloba.it/assets/icon-mail.svg" alt="" class="icon-img"></span>
          </a>
        </li>
      </ul>
    </div>

    <footer>zio tibia sta arrivando</footer>
  </main>

  <div class="leaf-layer">
    <img class="leaf leaf--tl"  src="https://www.ginko-biloba.it/assets/leaf.webp" alt="">
    <img class="leaf leaf--mid" src="https://www.ginko-biloba.it/assets/leaf.webp" alt="">
    <img class="leaf leaf--br"  src="https://www.ginko-biloba.it/assets/leaf.webp" alt="">
    <img class="leaf leaf--br2" src="https://www.ginko-biloba.it/assets/leaf.webp" alt="">
  </div>



  <script>
    // parallax leggero sulle foglie in base alla posizione del mouse
    const leaves = document.querySelectorAll('.leaf');
    const isTouch = window.matchMedia('(pointer: coarse)').matches;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!isTouch && !prefersReducedMotion) {
      window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 2;
        const y = (e.clientY / window.innerHeight - 0.5) * 2;

        leaves.forEach((leaf, i) => {
          const depth = (i + 1) * 6;
          leaf.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
        });
      });
    }
  </script>

</body>
</html>
